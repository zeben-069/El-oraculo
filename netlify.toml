# netlify.toml — le dice a Netlify dónde buscar las funciones
#
# Va en la RAÍZ de la carpeta, al lado de index.html:
#
#   naira/
#     index.html
#     netlify.toml        ← este archivo
#     netlify/
#       functions/
#         naira.js
#
# Sin esto, Netlify a veces no reconoce la carpeta de funciones y las ignora
# (en el registro sale "skipped"). Con esto, se la señalamos a dedo.

[build]
  functions = "netlify/functions"
  publish = "."

# La ruta bonita: /api/naira llama a la función naira.
# El archivo también la declara por su cuenta, pero repetirla aquí no molesta
# y cubre el caso de que Netlify no lea la configuración de dentro del archivo.
[[redirects]]
  from = "/api/naira"
  to = "/.netlify/functions/naira"
  status = 200
  force = true

# Y la que va soltando el texto según se escribe. El navegador prueba esta
# primero y, si no está, cae sola en la de arriba: por eso hay dos.
[[redirects]]
  from = "/api/naira-stream"
  to = "/.netlify/functions/naira-stream"
  status = 200
  force = true

# El manifiesto tiene que llegar con su tipo correcto o el navegador lo
# ignora y no deja instalar la app en la pantalla de inicio.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# La página de diagnóstico de las ortofotos se publica a propósito, pero no
# tiene por qué salir en Google: es una trastienda, no contenido.
[[headers]]
  for = "/probar-aereo.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# LAS IMÁGENES SE REEMPLAZAN CON EL MISMO NOMBRE, y esto lo teníamos mal.
# Aquí ponía una semana para todo `/img/*`, y el razonamiento —«no cambian casi
# nunca»— era cierto de los iconos y falso de las ilustraciones: cada vez que
# Zeben manda un cartel nuevo se guarda encima del viejo, con su nombre. Así
# que soltaba el zip, abría la web y seguía viendo el de antes, y desde aquí no
# hay manera de verlo: el zip estaba bien.
# La regla: **lo que puede cambiar sin cambiar de nombre, se pregunta siempre**.
# Es un 304 de nada, y son nueve carteles y la estampa del pueblo que se mire.
# Se nombran las carpetas UNA A UNA y no `/img/*` a propósito: con dos reglas
# que casen con el mismo fichero, Netlify las junta y acaba mandando dos
# `Cache-Control` — y entonces quién gana depende del navegador. Ninguna regla
# de aquí pisa a otra.
[[headers]]
  for = "/img/cartas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/estampas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/comarcas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/sitios/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Esta sí: la imagen de compartir no se toca, y quien la pide son los previos
# de WhatsApp, no la web.
[[headers]]
  for = "/img/naira-social.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icono*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
