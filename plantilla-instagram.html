<meta charset="utf-8"><title>El contenido de la semana · Naira</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;background:#FBF5E9;color:#3E2B1C;margin:0;padding:16px 14px 40px}
 h1{font:800 21px/1.2 Georgia,serif;margin:0 0 4px}
 p.ayuda{margin:6px 0 16px;font-size:14px;line-height:1.55;color:#6B5238;max-width:640px}
 p.ayuda b{color:#3E2B1C}
 .dia{font:700 15px/1.2 Georgia,serif;margin:22px 0 9px;padding:0 0 5px;
      border-bottom:1.5px solid #C9B896}
 .post{background:#fff;border:1.5px solid #3E2B1C;border-radius:14px;padding:12px;
       margin:0 0 14px;box-shadow:2.5px 2.5px 0 #3E2B1C;max-width:640px}
 .cab{display:flex;gap:11px;align-items:flex-start}
 .mini{width:82px;height:82px;border-radius:10px;object-fit:cover;flex:0 0 auto;
       border:1.5px solid #C9B896;background:#EFE4CE}
 .tit{font:700 15.5px/1.3 Georgia,serif;margin:0}
 .meta{font-size:12px;color:#6B5238;margin:4px 0 0;line-height:1.5}
 .cred{font-size:11.5px;color:#6B5238;margin:5px 0 0;font-style:italic}
 .cred.falta{color:#A33; font-style:normal;font-weight:600}
 .idis{display:flex;gap:6px;margin:11px 0 0;flex-wrap:wrap}
 .idis button{font:600 12px system-ui;background:#EFE4CE;color:#3E2B1C;
       border:1.5px solid #C9B896;border-radius:8px;padding:5px 11px;cursor:pointer}
 .idis button.on{background:#2E5D4B;color:#FBF5E9;border-color:#2E5D4B}
 pre{white-space:pre-wrap;word-wrap:break-word;font:400 13.5px/1.6 system-ui;
     background:#FBF5E9;border:1.5px solid #C9B896;border-radius:10px;
     padding:10px 11px;margin:9px 0 0}
 .tags{font-size:12.5px;color:#2C6E7F;margin:8px 0 0;line-height:1.5}
 .soloes{font-size:12.5px;line-height:1.55;color:#6B5238;background:#FFF6E0;
     border:1.5px solid #E0CFA4;border-radius:9px;padding:8px 10px;margin:9px 0 0}
 .soloes b{color:#3E2B1C}
 .acc{display:flex;gap:7px;margin:10px 0 0;flex-wrap:wrap}
 .acc button{font:600 12.5px system-ui;background:#2E5D4B;color:#FBF5E9;border:0;
       border-radius:8px;padding:7px 12px;cursor:pointer}
 .acc button.otro{background:#2C6E7F}
 .acc button.hecho{background:#6B5238}
 .lista{margin:8px 0 0;padding:0 0 0 2px;list-style:none;font-size:13px;line-height:1.65}
 .lista li{padding:2px 0;border-bottom:1px dotted #E0D3B8}
 .lista b{font-weight:700}
 .lista i{color:#6B5238;font-style:normal}
 .nada{background:#FFF6E0;border:1.5px solid #C9B896;border-radius:12px;padding:12px;
       max-width:640px;font-size:14px;line-height:1.6}
 canvas{display:none}
</style>

<h1>El contenido de la semana</h1>
<p class="ayuda">Sale del calendario de Naira: <b>nada de esto está inventado</b> —día,
pueblo, hora y sitio son los de la ficha—. Elige el idioma, copia el texto, baja la
imagen y publícalo tú. <b>Si la foto trae crédito, tiene que ir en el pie</b>: son de
Wikimedia Commons y la licencia lo exige.</p>

<div id="todo"></div>
<canvas id="lienzo" width="1080" height="1080"></canvas>

<script>
const POSTS=/*POSTS*/[];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const bonita=iso=>{const d=new Date(iso+'T12:00:00');
  return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];};
const hoyISO=()=>new Date().toISOString().slice(0,10);

/* Lo publicado se marca aquí y se queda: el navegador lo recuerda, así que
   volver a abrir la página no obliga a acordarse de por dónde iba. */
const YA=(()=>{ try{ return new Set(JSON.parse(localStorage.getItem('naira-ig')||'[]')); }
                catch(e){ return new Set(); } })();
const guarda=()=>{ try{ localStorage.setItem('naira-ig',JSON.stringify([...YA])); }catch(e){} };

function tarjeta(p){
  const d=document.createElement('div');
  d.className='post';
  const id=p.tipo+'|'+p.f+'|'+(p.n||p.m);
  const foto=p.foto?p.foto.f:'';

  if(p.tipo==='programa'){
    const li=p.actos.map(a=>'<li><b>'+(a.h||'—')+'</b> '+esc(a.n)+
      (a.lu?' <i>· '+esc(a.lu)+'</i>':'')+'</li>').join('');
    d.innerHTML=
      '<div class="cab">'+(foto?'<img class="mini" src="'+foto+'" alt="">':'')+
      /* «Qué hay hoy» solo vale si el post es de hoy: la página se abre un
         lunes y trae tres semanas por delante, así que un post del día 26
         decía «hoy» estando a dos semanas. Se dice el día. */
      '<div><p class="tit">🗓️ '+(p.f===hoyISO()?'Qué hay hoy en ':'Qué hay el '+
        bonita(p.f).replace(/^\w+ /,'')+' en ')+esc(p.m)+'</p>'+
      '<p class="meta">'+bonita(p.f)+' · '+p.actos.length+' actos'+
      (p.fiesta?' · '+esc(p.fiesta):'')+'</p>'+
      creditoHTML(p)+'</div></div>'+
      '<ul class="lista">'+li+'</ul>'+
      '<div class="acc"><button data-c="lista">Copiar la lista</button>'+
      (foto?'<button class="otro" data-img="1">Bajar la imagen</button>':'')+
      '<button class="hecho" data-ok="1">'+(YA.has(id)?'✓ publicado':'Marcar publicado')+'</button></div>';
    d.querySelector('[data-c]').onclick=()=>copiar(
      '🗓️ '+(p.fiesta?p.fiesta+' · ':'')+p.m+'\n'+bonita(p.f)+'\n\n'+
      p.actos.map(a=>(a.h||'')+'  '+a.n+(a.lu?'\n         📍 '+a.lu:'')).join('\n')+
      '\n\n📍 '+p.m,
      d.querySelector('[data-c]'));
  }else{
    d.innerHTML=
      '<div class="cab">'+(foto?'<img class="mini" src="'+foto+'" alt="">':'')+
      '<div><p class="tit">'+p.icono+' '+esc(p.n)+'</p>'+
      '<p class="meta">'+bonita(p.f)+' · '+esc(p.m)+
      (p.h?' · '+p.h:'')+(p.lu?'<br>'+esc(p.lu):'')+'</p>'+
      creditoHTML(p)+'</div></div>'+
      '<div class="idis"><button class="on" data-i="es">Español</button>'+
      '<button data-i="en">English</button><button data-i="de">Deutsch</button></div>'+
      '<pre></pre>'+
      (p.notaSoloEs?'<p class="soloes">Esta lleva una frase buena del catálogo que '+
        '<b>solo va en español</b>: «'+esc(p.notaSoloEs)+'». Tradúcela tú si publicas '+
        'en inglés o alemán — meterla por plantilla sería reescribirla.</p>':'')+
      '<p class="tags">'+p.etiquetas.join(' ')+'</p>'+
      '<div class="acc"><button data-c="txt">Copiar el texto</button>'+
      '<button class="otro" data-c="tag">Copiar las etiquetas</button>'+
      (foto?'<button class="otro" data-img="1">Bajar la imagen</button>':'')+
      '<button class="hecho" data-ok="1">'+(YA.has(id)?'✓ publicado':'Marcar publicado')+'</button></div>';
    const pre=d.querySelector('pre');
    let idi='es';
    const pinta=()=>{ pre.textContent=p.textos[idi]+
      (p.foto&&p.foto.credito?'\n\n📷 '+p.foto.credito:''); };
    pinta();
    d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      idi=b.dataset.i;
      d.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('on',x===b));
      pinta();
    });
    d.querySelector('[data-c="txt"]').onclick=e=>copiar(pre.textContent,e.target);
    d.querySelector('[data-c="tag"]').onclick=e=>copiar(p.etiquetas.join(' '),e.target);
  }

  const bImg=d.querySelector('[data-img]');
  if(bImg) bImg.onclick=()=>bajarCuadrada(foto,p,bImg);
  const bOk=d.querySelector('[data-ok]');
  bOk.onclick=()=>{ if(YA.has(id)){YA.delete(id);bOk.textContent='Marcar publicado';d.style.opacity='';}
                    else {YA.add(id);bOk.textContent='✓ publicado';d.style.opacity=.55;}
                    guarda(); };
  if(YA.has(id)) d.style.opacity=.55;
  return d;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,x=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));

function creditoHTML(p){
  if(!p.foto) return '<p class="cred falta">Sin foto: por aquí no hay ninguna fichada.</p>';
  if(p.foto.estampa) return '<p class="cred">Estampa de '+esc(p.m)+
    ' — no hay ninguna foto a menos de 8 km de donde es la fiesta.</p>';
  /* A partir de 3 km la foto ya no es «de donde se va»: se avisa para que él
     decida, que es la regla de siempre — la corazonada se enseña, no se
     aplica sola. */
  const lejos=(p.foto.d>3)?'<p class="cred falta">Ojo: esta foto está a '+p.foto.d+
    ' km de donde es la fiesta'+(p.foto.otroPueblo?', y es de '+esc(p.foto.otroPueblo):'')+
    '. Mira si vale.</p>':'';
  if(p.foto.credito) return '<p class="cred">📷 '+esc(p.foto.de)+' · '+esc(p.foto.credito)+
    ' — <b>hay que citarlo en el pie</b></p>'+lejos;
  return '<p class="cred">📷 '+esc(p.foto.de)+' — foto tuya, no cita a nadie</p>'+lejos;
}

function copiar(t,btn){
  navigator.clipboard.writeText(t).then(()=>{
    const antes=btn.textContent; btn.textContent='✓ copiado';
    setTimeout(()=>btn.textContent=antes,1400);
  });
}

/* Instagram quiere cuadrado. Las fotos del catálogo son de 240 px y cuadradas
   ya, y las estampas son apaisadas: se recortan por el centro y se suben a
   1080, que es lo que pide. La foto se dibuja tal cual — NO se le escribe
   texto encima: el texto va en el pie del post, donde se puede leer, copiar
   y traducir. Un cartel con letras quemadas dentro es justo lo que no se
   puede traducir a tres idiomas. */
async function bajarCuadrada(src,p,btn){
  const cv=document.getElementById('lienzo'), x=cv.getContext('2d');
  const im=new Image();
  im.onload=()=>{
    const lado=Math.min(im.width,im.height);
    x.fillStyle='#EFE4CE'; x.fillRect(0,0,1080,1080);
    x.drawImage(im,(im.width-lado)/2,(im.height-lado)/2,lado,lado,0,0,1080,1080);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=(p.f+'-'+(p.n||p.m)).toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'')
        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.jpg';
      a.click();
      const antes=btn.textContent; btn.textContent='✓ bajada';
      setTimeout(()=>btn.textContent=antes,1400);
    },'image/jpeg',.9);
  };
  im.onerror=()=>{ btn.textContent='no carga la foto'; };
  im.src=src;
}

const todo=document.getElementById('todo');
if(!POSTS.length){
  todo.innerHTML='<div class="nada">No hay ninguna fiesta fichada en este rango. '+
    'Prueba con más días: <b>node instagram.js 45</b></div>';
}else{
  let dia='';
  POSTS.slice().sort((a,b)=>a.f.localeCompare(b.f)).forEach(p=>{
    if(p.f!==dia){ dia=p.f;
      const h=document.createElement('p'); h.className='dia';
      h.textContent=bonita(dia); todo.appendChild(h); }
    todo.appendChild(tarjeta(p));
  });
}
</script>
